name: Cloud AVD Appium Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-cloud-emulator:
    runs-on: macos-latest  # macOS runners natively support fast Android/iOS nested virtualization

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Android Emulator (AVD)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            adb devices
            npm install -g appium
            appium driver install uiautomator2
            appium &
            sleep 5
            python scripts/run_workflow.py