name: Cloud AVD Appium Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-cloud-emulator:
    runs-on: macos-13  # Uses Intel macOS runner for stable x86_64 emulator support

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Android Emulator (AVD)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb devices
            npm install -g appium
            appium driver install uiautomator2
            appium &
            sleep 5
            python scripts/run_workflow.py